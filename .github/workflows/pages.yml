# Veröffentlicht den Ordner "site" über GitHub Pages.
#
# Absichtlich ohne Bauschritt: "site" liegt fertig gebaut im Repository.
# So kann die Veröffentlichung nicht an npm, an einer Abhängigkeit oder an
# einer Werkzeugversion scheitern - der Link für Mitspieler bleibt stehen.
# Gebaut wird vorher von Hand mit "npm run bauen".
name: Seite veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  veroeffentlichen:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - name: Quelltext holen
        uses: actions/checkout@v4

      - name: Pages vorbereiten
        uses: actions/configure-pages@v5

      - name: Ordner hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Veröffentlichen
        id: pages
        uses: actions/deploy-pages@v4
